<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="developjik - agent and desktop tooling">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#11161f"/><stop offset="1" stop-color="#0b0e13"/></linearGradient>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4d8dff"/><stop offset="1" stop-color="#9ecbff"/></linearGradient>
  <linearGradient id="dim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#26427a"/><stop offset="1" stop-color="#4d8dff"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#4d8dff" stroke-opacity="0.055"/></pattern>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4d8dff" stop-opacity="0.26"/><stop offset="1" stop-color="#4d8dff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="430" fill="url(#bg)"/>
<rect width="1600" height="430" fill="url(#grid)"/>
<ellipse cx="290" cy="205" rx="390" ry="225" fill="url(#glow)"><animate attributeName="opacity" values="0.75;1;0.75" dur="6s" repeatCount="indefinite"/></ellipse>
<circle cx="120" cy="410" r="3" fill="#4d8dff"><animate attributeName="cy" values="410;40" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.55;0" dur="9s" repeatCount="indefinite"/></circle>
<circle cx="250" cy="430" r="2.5" fill="#9ecbff"><animate attributeName="cy" values="430;30" dur="13s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.4;0" dur="13s" begin="2s" repeatCount="indefinite"/></circle>
<circle cx="410" cy="420" r="2" fill="#4d8dff"><animate attributeName="cy" values="420;60" dur="11s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="11s" begin="5s" repeatCount="indefinite"/></circle>
<rect x="1.5" y="1.5" width="1597" height="427" rx="18" fill="none" stroke="#26427a" stroke-opacity="0.85"/>
<text x="72" y="84" font-size="24" fill="#8b949e">// seoul · frontend × agent builder</text>
<text x="66" y="196" font-size="100" font-weight="700" letter-spacing="2" fill="url(#ac)">developjik</text>
<rect x="72" y="222" height="7" rx="3.5" width="0" fill="url(#dim)"><animate attributeName="width" from="0" to="560" begin="0.5s" dur="0.9s" fill="freeze"/></rect>
<text x="72" y="274" font-size="30" fill="#c9d1d9">사람은 설계하고, 에이전트가 일하게 만듭니다</text>
<g font-size="22" fill="#9ecbff" text-anchor="middle">
  <rect x="72"   y="318" width="110" height="46" rx="23" fill="#0e1116" stroke="#26427a"/><text x="127" y="348">react</text>
  <rect x="198"  y="318" width="170" height="46" rx="23" fill="#0e1116" stroke="#26427a"/><text x="283" y="348">typescript</text>
  <rect x="384"  y="318" width="118" height="46" rx="23" fill="#0e1116" stroke="#26427a"/><text x="443" y="348">tauri</text>
  <rect x="518"  y="318" width="100" height="46" rx="23" fill="#0e1116" stroke="#26427a"/><text x="568" y="348">rust</text>
  <rect x="634"  y="318" width="126" height="46" rx="23" fill="#0e1116" stroke="#26427a"/><text x="697" y="348">agents</text>
</g>
<text x="72" y="406" font-size="19" fill="#8b949e">✦ this profile is agent-managed — crafted by dinobot</text>
<g transform="translate(880,58)">
  <rect width="650" height="314" rx="14" fill="#0b0e13" stroke="#26427a"/>
  <path d="M0 46 h650 v252 a14 14 0 0 1 -14 14 h-622 a14 14 0 0 1 -14 -14 z" fill="#161b22"/>
  <circle cx="30" cy="23" r="7.5" fill="#ff5f57"/><circle cx="54" cy="23" r="7.5" fill="#febc2e"/><circle cx="78" cy="23" r="7.5" fill="#28c840"/>
  <text x="325" y="30" font-size="18" fill="#8b949e" text-anchor="middle">developjik — zsh</text>
  <g font-size="23">
    <text x="28" y="88" fill="#e6edf3" opacity="0">$ whoami<animate attributeName="opacity" to="1" begin="0.2s" dur="0.25s" fill="freeze"/></text>
    <text x="28" y="130" fill="#8b949e" opacity="0">→ frontend dev × agent builder · Seoul<animate attributeName="opacity" to="1" begin="0.6s" dur="0.25s" fill="freeze"/></text>
    <text x="28" y="172" fill="#e6edf3" opacity="0">$ cargo build --release<animate attributeName="opacity" to="1" begin="1.0s" dur="0.25s" fill="freeze"/></text>
    <text x="28" y="214" fill="#8b949e" opacity="0">   Compiling damon-agent-core v0.8.0<animate attributeName="opacity" to="1" begin="1.4s" dur="0.25s" fill="freeze"/></text>
    <text x="28" y="256" fill="#3fb950" opacity="0">   Finished release in 0.42s ✓<animate attributeName="opacity" to="1" begin="1.8s" dur="0.25s" fill="freeze"/></text>
    <text x="28" y="298" fill="#e6edf3" opacity="0">$ ship it<animate attributeName="opacity" to="1" begin="2.2s" dur="0.25s" fill="freeze"/></text>
  </g>
  <rect x="170" y="276" width="13" height="28" fill="#4d8dff"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.05s" repeatCount="indefinite"/></rect>
</g>
</svg>